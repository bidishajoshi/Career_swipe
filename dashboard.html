
    <!DOCTYPE html>
    <html>
    <head>
        <title>CareerSwipe - Database Dashboard</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            * 
    </head>
    <body>
        <div class="container">
            <h1>📊 CareerSwipe Database Dashboard</h1>
            <p style="color: white; text-align: center; margin-bottom: 30px;">Last updated: 2026-04-28 10:27:44</p>
            
            
    <div style="background:#fee; border:1px solid #f99; padding:15px; border-radius:8px; margin-bottom:20px;">
        <strong>⚠️ Database Schema Issue:</strong> (psycopg2.errors.UndefinedColumn) column seekers.address does not exist
LINE 2: ...rs_password_hash,
        <p style="margin-top:10px; font-size:12px;">This usually means your production database needs migration. Run: <code>flask db upgrade</code></p>
    </div>
    
            
            <div class="grid">
                <div class="card">
                    <h3>👥 Total Seekers</h3>
                    <div class="number">0</div>
                </div>
                <div class="card">
                    <h3>🏢 Total Companies</h3>
                    <div class="number">0</div>
                </div>
                <div class="card">
                    <h3>📋 Job Listings</h3>
                    <div class="number">0</div>
                </div>
                <div class="card">
                    <h3>💼 Total Applications</h3>
                    <div class="number">0</div>
                </div>
                <div class="card">
                    <h3>✅ Accepted</h3>
                    <div class="number" style="color: #10b981;">0</div>
                </div>
                <div class="card">
                    <h3>⏳ Pending</h3>
                    <div class="number" style="color: #f59e0b;">0</div>
                </div>
                <div class="card">
                    <h3>❌ Rejected</h3>
                    <div class="number" style="color: #ef4444;">0</div>
                </div>
                <div class="card">
                    <h3>🔔 Notifications</h3>
                    <div class="number">0</div>
                </div>
            </div>
            
            <div class="chart-container">
                <canvas id="statusChart"></canvas>
            </div>
            
            <div class="chart-container">
                <canvas id="usersChart"></canvas>
            </div>
        </div>
        
        <script>
            // Application Status Chart
            new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Accepted', 'Pending', 'Rejected'],
                    datasets: [{
                        data: [0, 0, 0],
                        backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                        borderColor: 'white',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: 'Application Status Distribution', font: { size: 16 } },
                        legend: { position: 'bottom' }
                    }
                }
            });
            
            // Users & Jobs Chart
            new Chart(document.getElementById('usersChart'), {
                type: 'bar',
                data: {
                    labels: ['Seekers', 'Companies', 'Job Listings', 'Applications'],
                    datasets: [{
                        label: 'Count',
                        data: [0, 0, 0, 0],
                        backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4facfe'],
                        borderRadius: 8,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: 'Platform Overview', font: { size: 16 } },
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        </script>
    </body>
    </html>
